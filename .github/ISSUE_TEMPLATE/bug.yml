name: Bug
description: Something on the fleet does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what went wrong. Paste errors and logs as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. fleet rebuild
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fleet commit
      description: The commit the VPS runs, if relevant.
