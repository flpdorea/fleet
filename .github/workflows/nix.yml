# Checks that the scripts pass shellcheck and the NixOS configuration
# evaluates, so a broken change shows up here rather than on the VPS.
# Pinned versions are updated by pull requests from the versions workflow.
name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Shellcheck
        run: nix run nixpkgs#shellcheck -- -S warning --shell=bash install.sh nix/setup-user.sh nix/fleet.sh scripts/tailscale-authkey.sh scripts/tailscale-bootstrap.sh scripts/versions.sh

      # --no-update-lock-file: fail if flake.nix needs a lock entry that is
      # not committed, instead of evaluating versions the VPS would not get.
      - name: Evaluate the whole NixOS configuration
        run: nix eval --no-update-lock-file --raw .#nixosConfigurations.ci.config.system.build.toplevel.drvPath
